<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code PIN</title>

<style>

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial;
    background:linear-gradient(180deg,#0f172a,#020617);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

.phone{
    width:320px;
    text-align:center;
}

h2{
    font-weight:500;
    margin-bottom:30px;
}

.pin{
    display:flex;
    justify-content:center;
    gap:14px;
    margin-bottom:20px;
}

.bubble{
    width:18px;
    height:18px;
    border-radius:50%;
    border:2px solid white;
}

.filled{
    background:white;
}

.error .bubble{
    border-color:#ff4d4d;
}

.error .filled{
    background:#ff4d4d;
}

.message{
    height:20px;
    margin-bottom:20px;
    color:#ff4d4d;
    font-size:14px;
}

.keypad{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    justify-items:center;
}

.key{
    width:70px;
    height:70px;
    border-radius:50%;
    background:rgba(255,255,255,0.1);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:26px;
    cursor:pointer;
    backdrop-filter:blur(10px);
    transition:0.15s;
}

.key:hover{
    background:rgba(255,255,255,0.25);
}

.key:active{
    transform:scale(0.9);
}

.empty{
    visibility:hidden;
}

</style>
</head>

<body>

<div class="phone">

<h2>Entrer le code</h2>

<div class="pin" id="pin">
<div class="bubble"></div>
<div class="bubble"></div>
<div class="bubble"></div>
<div class="bubble"></div>
<div class="bubble"></div>
</div>

<div class="message" id="message"></div>

<div class="keypad">

<div class="key" onclick="press(1)">1</div>
<div class="key" onclick="press(2)">2</div>
<div class="key" onclick="press(3)">3</div>

<div class="key" onclick="press(4)">4</div>
<div class="key" onclick="press(5)">5</div>
<div class="key" onclick="press(6)">6</div>

<div class="key" onclick="press(7)">7</div>
<div class="key" onclick="press(8)">8</div>
<div class="key" onclick="press(9)">9</div>

<div class="key empty">.</div>
<div class="key" onclick="press(0)">0</div>
<div class="key" onclick="del()">⌫</div>

</div>

</div>

<script>

const correctCode = "84212"
let code = ""

function press(num){

    if(code.length >= correctCode.length) return

    code += num
    update()

    if(code.length === correctCode.length){
        setTimeout(checkCode,200)
    }

}

function del(){
    code = code.slice(0,-1)
    update()
}

function update(){

    const bubbles = document.querySelectorAll(".bubble")

    bubbles.forEach((b,i)=>{
        if(i < code.length){
            b.classList.add("filled")
        }else{
            b.classList.remove("filled")
        }
    })

}

function checkCode(){

    const pin = document.getElementById("pin")
    const message = document.getElementById("message")

    if(code === correctCode){

        message.style.color="#4ade80"
        message.textContent="Code correct ✅"

    }else{

        pin.classList.add("error")
        message.textContent="Code incorrect"

        setTimeout(()=>{
            reset()
            pin.classList.remove("error")
        },800)

    }

}

function reset(){

    code = ""
    document.getElementById("message").textContent=""

    const bubbles = document.querySelectorAll(".bubble")
    bubbles.forEach(b=>b.classList.remove("filled"))

}

</script>

</body>
</html>
